<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PikCal - Legal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ds-black: #000000;
            --ds-white: #FFFFFF;
            --ds-gray: #9CA3AF;
            --ds-light-gray: #F5F5F5;
            --ds-accent: #E8A87C;
            --ds-accent-light: #FDF2E9;
            --ds-success: #10B981;
            --ds-danger: #E57373;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-xxl: 48px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ds-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: var(--spacing-xl);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--ds-black);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .logo svg {
            width: 44px;
            height: 44px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--ds-black);
            margin-bottom: var(--spacing-xs);
        }

        .tagline {
            font-size: 14px;
            font-weight: 400;
            color: var(--ds-gray);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xxl);
        }

        a.link-card {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-lg);
            background: var(--ds-light-gray);
            border-radius: var(--radius-lg);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a.link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        a.link-card:active {
            transform: scale(0.98);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            background: var(--ds-black);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .link-icon svg {
            width: 22px;
            height: 22px;
            color: var(--ds-white);
        }

        .link-text {
            text-align: left;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--ds-black);
        }

        .link-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: var(--ds-gray);
            margin-top: 2px;
        }

        .link-arrow {
            margin-left: auto;
            color: var(--ds-gray);
        }

        .footer {
            margin-top: var(--spacing-xxl);
            font-size: 12px;
            color: var(--ds-gray);
        }

        .footer a {
            color: var(--ds-accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#E8A87C"/>
                    <path d="M15 8.5c0 1.38-1.12 2.5-2.5 2.5S10 9.88 10 8.5 11.12 6 12.5 6 15 7.12 15 8.5z" fill="#fff"/>
                    <path d="M12 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#fff" opacity="0.7"/>
                </svg>
            </div>
            <h1>PikCal</h1>
            <p class="tagline">Snap. Track. Thrive.</p>
        </div>

        <div class="links">
            <a href="privacy" class="link-card">
                <div class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <div class="link-text">
                    <div class="link-title">Privacy Policy</div>
                    <div class="link-subtitle">How we protect your data</div>
                </div>
                <svg class="link-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </a>

            <a href="terms" class="link-card">
                <div class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                </div>
                <div class="link-text">
                    <div class="link-title">Terms of Service</div>
                    <div class="link-subtitle">Rules for using PikCal</div>
                </div>
                <svg class="link-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </a>
        </div>

        <p class="footer">
            Questions? <a href="mailto:support@pikcal.app">Contact us</a>
        </p>
    </div>
</body>
</html>
